spring.application.name=kafka-offset-demo

# ── Kafka broker ────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# ── Topic names (existing JSON-based flow) ──────────────────────────────────
kafka.topics.main=events-topic
kafka.topics.dlt=events-topic.DLT

# ── Avro / Schema Registry flow ─────────────────────────────────────────────
# Confluent Schema Registry URL (started via docker-compose)
kafka.schema-registry.url=http://localhost:8081

# Avro topic – a separate topic so it does not clash with the JSON topic
kafka.topics.avro=avro-events-topic

